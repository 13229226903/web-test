[pytest]
# 基础 URL 优先级：命令行 --base-url > 环境变量 PYTEST_BASE_URL / POKECUT_BASE_URL > 下方 base_url 默认值
# 测试服域名变动时：改下方默认值，或设 POKECUT_BASE_URL（支持 .env），或命令行 --base-url 覆盖；无需改测试代码
addopts = --tb=short --html=reports/report.html --self-contained-html --alluredir=reports/allure-results
base_url = http://10.17.1.66:3001
testpaths = tests
filterwarnings =
    ignore::pytest.PytestCollectionWarning

# 自定义标记
markers =
    regression: SEO/功能回归测试
    login_required: 需要登录
    no_login: 无需登录
    full: 全量用例
    seo: SEO 页面检测
    seo_new: SEO 新页面零配置三层检测
    smoke: 冒烟测试
    p0: P0 优先级用例

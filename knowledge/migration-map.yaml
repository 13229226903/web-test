version: "1.0"
policy: "先建立索引和 source_refs，再逐条迁移；只保留 rule.md 的硬规则、PROJECT.md 的项目事实和 page_map 的当前页面事实，业务经验正文迁移后不在原文件重复维护。"
routes:
  - source: "rule.md"
    topic: "selector、MCP、pytest、Allure、截图、Windows 执行红线"
    destination: "rule.md"
    action: "retain_authoritative"
  - source: "rule.md"
    topic: "SEO 落地页主上传入口"
    destination: "knowledge/modules/seo-landing.yaml#KB-ENTRY-0001"
    action: "canonical_after_dedup"
  - source: "rule.md"
    topic: "网关 502/504、入口未挂载重试"
    destination: "knowledge/modules/seo-landing.yaml#KB-PITFALL-0005"
    action: "canonical_after_dedup"
  - source: "PROJECT.md"
    topic: "移动端登录入口、账号态、环境顺序"
    destination: "knowledge/shared.yaml"
    action: "retrieval_summary_only_source_remains_PROJECT_or_runtime"
  - source: "page_map/"
    topic: "当前页面 selector、状态和按钮"
    destination: "page_map/"
    action: "retain_as_page_source"
  - source: "artifacts/<task_id>/sync.md"
    topic: "当前任务真实探索结果"
    destination: "artifacts/<task_id>/sync.md"
    action: "candidate_source_until_archive_confirmation"

  title: 旧画布 AIGC 任务记录从 console 抓 handleSubmitTask result 的 taskId，链路区分 efMode / styleId
  summary: 旧画布 AI Tools 各功能的真实提交证据可从浏览器 console 抓取： `handleSubmitTask result {"resultCode":100,...,"data":{"taskId":"..."}}`

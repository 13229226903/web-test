  title: 旧画布 AIGC 生成中的进度提示只画在 canvas 上，判忙需用画面指纹或 Confirm+Cancel 组合态
  summary: 旧画布 AI Tools 功能面板在生成中会渲染百分比进度环，但该环是**画在 canvas 上**的， DOM 文本里取不到 "NN%"；且进度层会吞掉页面点击（包括
    Cancel）。 因此判断"是否仍在生成"不能依赖 DOM 文本，也不能只依赖 Confirm 的可用性—— 同一面板内第二次提交时，面板仍显示上一次结果的状态，Confirm
    在生成期间保持可用。

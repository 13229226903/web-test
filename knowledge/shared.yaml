- schema_version: '1.0'
  knowledge_id: KB-RULE-0002
  knowledge_type: business_rule
  title: 移动端登录通过 Sign up 弹窗完成
  subject_key: auth.mobile.signup_modal_login
  status: active
  priority: P0
  confidence: high
  summary: 移动端没有独立 Login 入口，需要从 Sign up 进入弹窗后填写 Email 和验证码。
  rule:
    given:
    - 用户处于移动端站点
    when:
    - 用户需要登录
    then:
    - 点击 Sign up
    - 在弹窗中填写 Email 和 Verification Code
    exceptions: []
  source_refs:

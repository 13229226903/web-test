  title: 移动端登录通过 Sign up 弹窗完成
  subject_key: auth.mobile.signup_modal_login
  status: active
  priority: P0
  confidence: high
  summary: 移动端没有独立 Login 入口，需要从 Sign up 进入弹窗后填写 Email 和验证码。
  rule:
    given:
    - 用户处于移动端站点

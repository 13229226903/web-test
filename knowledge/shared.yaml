- schema_version: '1.0'
  knowledge_id: KB-RULE-0003
  knowledge_type: permission_rule
  title: 账号态必须按用例目的选择，不使用 conftest 默认值替代
  subject_key: account.permission.select_by_test_purpose
  status: active
  priority: P0
  confidence: high
  summary: 会员、单项购买、免费和匿名账号改变业务预期时，必须按用例目的选择账号态。
  rule:
    given:
    - 用例涉及登录、会员、购买、credits、权限或批量拦截
    when:
    - 准备执行探索或回归
    then:
    - 按 confirmed cases / sync.md 和 PROJECT.md 账号表选择账号态
    - 普通登录或免费态不得误用会员账号
    exceptions:
    - conftest.py 默认值只能作为兜底，不能作为账号选择依据
  source_refs:
  - ref: PROJECT.md
    type: project_fact
    note: 账号态选择规则
  - ref: artifacts/runtime/common.md
    type: runtime_rule
    note: 账号态由探索结果决定

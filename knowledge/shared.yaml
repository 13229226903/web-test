- schema_version: '1.0'
  knowledge_id: KB-ENV-0004
  knowledge_type: environment_behavior
  title: 生成类探索优先测试服，失败后再切预部署并重新登录
  subject_key: environment.generation.test_then_predeploy
  status: active
  priority: P1
  confidence: high
  summary: 生成、购买、订阅或 credits 探索先使用测试服，只有测试服失败才切预部署并重新登录。
  rule:
    given:
    - 任务需要生成、购买、订阅或验证 credits
    when:
    - 测试服上的目标动作失败
    then:
    - 通过目标页 DEBUG 面板切到预部署
    - 切换后重新登录并重新执行
    exceptions:
    - 预部署也失败时，在 sync.md / page_map 标记 skipped 并附两边证据
  source_refs:
  - ref: PROJECT.md
    type: project_fact
    note: 后端环境顺序
  - ref: artifacts/runtime/common.md
    type: runtime_rule
    note: 生成 / 购买 / 订阅探索边界

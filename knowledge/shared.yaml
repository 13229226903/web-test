- schema_version: '1.0'
  knowledge_id: KB-RULE-0007
  knowledge_type: business_rule
  title: 移动端功能级注册成功事件归属于打开注册弹窗的那个功能
  subject_key: auth.signup.feature_level_success_event_attribution
  status: active
  priority: P1
  confidence: high
  summary: 移动端由某功能触发的注册弹窗，注册成功后只产出该功能自己的功能级注册成功事件；PC 侧该功能级事件缺失。
  rule:
    given:
    - 移动端匿名或 0 credits 用户
    - 用户在某个功能面板提交任务触发注册弹窗
    when:
    - 用户完成注册
    then:
    - 功能级注册事件与注册成功事件都带「打开弹窗的那个功能」这一归属
    - 不同功能各自产出自己的功能级事件，不会互相串号
    exceptions:
    - PC 侧当前只有通用注册事件（注册弹窗_出现 / 注册弹窗_注册成功 + 登录成功_邮箱登录方式），功能级事件缺失，已记为 known_bug
    - 移动端结论不适用于 PC，故本切片 platform 仅记 mobile
  source_refs:
  - ref: artifacts/2026-09-17_mobile_canvas_stats_first10/exploration_report.md
    type: task_artifact
    note: 探索报告第 4 节 Bug A / §3 状态表
  - ref: artifacts/2026-09-17_mobile_canvas_stats_first10/evidence/automation_handoff.yaml
    type: task_artifact
    note: M-CORE-01 / M-CORE-02 与 P-INF-01 known_bug 契约

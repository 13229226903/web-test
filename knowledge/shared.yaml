- schema_version: '1.0'
  knowledge_id: KB-PITFALL-0010
  knowledge_type: technical_test_rule
  title: 结果弹窗底部下载前必须先移开 DEBUG 浮层
  subject_key: debug_overlay.result_download.must_move_before_click
  status: active
  priority: P1
  confidence: high
  summary: '移动端结果弹窗底部下载按钮与右下角 DEBUG 浮层位置重叠；DEBUG 为 position: static，必须改成 fixed 才能移开，否则点击会被遮挡。'
  rule:
    given:
    - 移动端结果图已生成，footer 出现底部下载按钮
    when:
    - 准备点击结果弹窗底部下载按钮
    then:
    - 先把 DEBUG 浮层移动或隐藏（需把 position 改为 fixed 才能生效）
    - 再用「位于视口下半部」区分底部下载按钮与顶部工具栏同图标按钮
    exceptions:
    - 仅移动端存在该重叠；PC 结果下载按钮 button[class*='download-left'] 不受影响
    - 不得用 force=True 绕过遮挡，可能点到错误元素
  source_refs:
  - ref: artifacts/2026-09-17_mobile_canvas_stats_first10/exploration_report.md
    type: task_artifact
    note: 探索报告 §3 状态表与 §7 待确认项
  - ref: page_map/pokecut/mobile_canvas_v11.yaml
    type: page_map
    note: mobile_result_popup_download 状态（含位置区分说明）

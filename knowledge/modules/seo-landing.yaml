- schema_version: '1.0'
  knowledge_id: KB-PITFALL-0005
  knowledge_type: historical_pitfall
  title: 网关 502/504 或入口未挂载先同 URL 重试一次
  subject_key: seo_landing.gateway_502_entry_not_mounted.retry_once
  status: active
  priority: P1
  confidence: high
  summary: 落地页返回 502/504 或主入口短时间未挂载时，先同一 URL 重试一次，不能立即判定为业务断言失败。
  rule:
    given:
    - 页面返回 502/504
    - 主上传入口在等待窗口内未挂载
    when:
    - 准备将其判定为断言失败
    then:
    - 同一 URL 重试一次
    exceptions:
    - 重试成功时记录环境偶发，不修改业务断言
    - 重试仍失败时记录 blocked 或 bug_candidate
  source_refs:

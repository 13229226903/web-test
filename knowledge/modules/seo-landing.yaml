  knowledge_type: legacy_entry
  title: SEO 落地页主上传入口使用稳定选择器
  subject_key: seo_landing.main_upload_entry
  status: active
  priority: P1
  confidence: high
  summary: SEO 落地页主上传入口优先使用模板级稳定选择器，不依赖 CTA 文案。
  rule:
    given:
    - 用户进入 SEO 落地页
    when:
    - 用户需要从首屏开始上传图片
    then:
    - 优先定位模板级主上传入口
    - 上传入口应能触发文件选择器
    exceptions:
    - 稳定入口不存在时，按对应 page_map 的 upload_selector / fallback_selector 处理
  entry_points:
  - id: main_upload
    state: landing_initial
    usable: true
    selector_authority: current_versioned_page_map
    page_map_refs:

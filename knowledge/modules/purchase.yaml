module:
  name: purchase
  display_name: 购买 / 内购
knowledge_slices:
- schema_version: '1.0'
  knowledge_id: KB-RULE-0006
  knowledge_type: business_rule
  title: 新用户促销弹窗先于内购弹窗出现，两者共用容器靠套餐卡片区分
  subject_key: purchase.checkout.promo_modal_before_iap_modal
  status: active
  priority: P1
  confidence: high
  summary: 新用户 24h 内触发购买时，促销弹窗先出现；关闭后才弹出真正的内购弹窗，两者共用同一弹窗容器，只能靠套餐卡片数量区分。
  rule:
    given:
    - 用户是新账号（注册后 24h 内）
    - 用户在画布页触发了需要购买的功能动作
    when:
    - 检查出现的购买弹窗类型
    then:
    - 先出现的是促销弹窗（无套餐卡片）
    - 关闭促销弹窗后才会出现真正的内购弹窗（含套餐卡片）
    - 判定方式：同容器下套餐卡片数量为 0 即促销弹窗，>=1 即内购弹窗
    exceptions:
    - 非新用户不弹促销弹窗，购买动作直接命中内购弹窗
    - PC 与移动端结论一致，仅布局不同

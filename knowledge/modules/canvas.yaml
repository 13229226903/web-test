- schema_version: '1.0'
  knowledge_id: KB-RULE-0011
  knowledge_type: technical_test_rule
  title: 旧画布 AIGC 生成中的进度提示只画在 canvas 上，判忙需用画面指纹或 Confirm+Cancel 组合态
  subject_key: canvas.aigc_panel.generating_state_detection
  status: active
  priority: P0
  confidence: high
  summary: >-
    旧画布 AI Tools 功能面板在生成中会渲染百分比进度环，但该环是**画在 canvas 上**的，
    DOM 文本里取不到 "NN%"；且进度层会吞掉页面点击（包括 Cancel）。
    因此判断"是否仍在生成"不能依赖 DOM 文本，也不能只依赖 Confirm 的可用性——
    同一面板内第二次提交时，面板仍显示上一次结果的状态，Confirm 在生成期间保持可用。
  rule:
    given:
    - 已打开旧画布 AI Tools 的某个功能面板
    - 已点击面板主提交按钮（或正在等待任务结束）
    when:
    - 需要判断任务是否仍在生成 / 是否真正结束
    then:
    - 不要用 DOM 文本判断百分比：进度环只在 canvas 上，panel.innerText 取不到 "NN%"
    - 不要只用 Confirm 可用性判断结束：同一面板第二次提交时 Confirm 生成期间仍可用（假结束）
    - 结束判据应为 Confirm 可用 **且 Cancel 可用**，再等预览画面指纹连续稳定
    - 生成期间进度层会吞掉点击（含 Cancel），需先等空闲再交互
    exceptions:
    - 首次提交时 Confirm 会正常转为禁用，此时仅凭 Confirm 亦可判断"生成中"
    - 无进度环的工具（如 AI Face Editor / AI Body Editor）不会出现百分比，但仍受 Cancel 判据约束
  source_refs:
  - ref: artifacts/2026-10-13_old_canvas_ai_tools_exploration/impl.md
    type: task_artifact
    note: §2.y 二次提交竞态（实测 Clothes Changer 二次提交 Confirm t=4~28 全程 enabled）

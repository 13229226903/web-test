- schema_version: '1.0'
  knowledge_id: KB-RULE-0012
  knowledge_type: technical_test_rule
  title: 旧画布 AIGC 任务记录从 console 抓 handleSubmitTask result 的 taskId，链路区分 efMode / styleId
  subject_key: canvas.aigc_panel.taskid_console_capture
  status: active
  priority: P1
  confidence: high
  summary: >-
    旧画布 AI Tools 各功能的真实提交证据可从浏览器 console 抓取：
    `handleSubmitTask result {"resultCode":100,...,"data":{"taskId":"..."}}` 提供 taskId；
    `[AIGC 公告板][开始检查] {funcType, styleId, serverFuncType}` 提供 styleId。
    legacy picEnhance 链路会额外出现 `efMode`（实测 240900033），ComfyUI 链路则带 `styleId`（形如 pkweb_comfyui_*）。
  rule:
    given:
    - 旧画布 AI Tools 面板已提交一次真实任务
    - 需要记录该次任务的 taskId（及可得的 efMode / styleId）
    when:
    - 在提交前注册 page.on("console") 监听并清空历史日志
    then:
    - taskId 取 `"taskId":"..."`；真实提交时断言其非空
    - efMode 取 `efMode:\s*(\d+)`（legacy picEnhance 链路，如 240900033 / 240100021）
    - styleId 取 `styleId:\s*([^,}\s]+)`（ComfyUI 链路，如 pkweb_comfyui_silentfilm、pkweb_comfyui_transfer_outfit_whitebg）
    - 无 handleSubmitTask 的路径（客户端即时预览、no-op）**不伪造 taskId**，只记录"无提交"
    exceptions:
    - 结果态工具切到已生成过的模型会命中缓存，不产生新提交，此时不出现 handleSubmitTask
  source_refs:
  - ref: artifacts/2026-10-13_old_canvas_ai_tools_exploration/impl.md
    type: task_artifact
    note: §4 提交任务记录（含四条链路的实测 taskId / styleId / efMode）

- schema_version: '1.0'
  knowledge_id: KB-RULE-0009
  knowledge_type: business_rule
  title: 工具栏/工具卡只打开功能面板，面板主提交按钮才真正发起任务
  subject_key: canvas.feature_panel.primary_submit_required
  status: active
  priority: P1
  confidence: high
  summary: PC 与移动端一致：点工具栏或工具卡只负责打开功能面板，只有面板内的主提交按钮才会真正发起任务并触发点统计。
  rule:
    given:
    - 画布页已加载输入图片
    - 需要触发某个功能的开始/提交/统计
    when:
    - 点击画布工具栏的同名按钮或工具卡
    then:
    - 只打开对应功能面板，不发起任务、不产出任务级统计
    - 必须再点击面板内主提交按钮，才会真正发起任务
    exceptions:
    - SEO 功能介绍页进入画布时功能面板会自动打开，但同样需要点主提交按钮
    - PC 与移动端按钮形态不同，但交互语义一致
  source_refs:

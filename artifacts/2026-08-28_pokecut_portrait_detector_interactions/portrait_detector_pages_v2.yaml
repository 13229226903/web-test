          hips: {selector: "input[aria-label='Hips in cm']", unit: cm}
        buttons:
          upload_photo: {selector: "button:has-text('Upload Photo')", action_result: 上传后显示缩略图 + Re-upload/Delete, reversible: true, explore_status: completed}
          continue: {selector: "button:has-text('Continue')", action_result: 上传照片后点击进入 processing，约 30s 出结果, reversible: true, explore_status: completed}

          try_my_photo: {selector: "button:has-text('Try My Photo')", action_result: "点击新开标签页进入 /agent?pid=... 画布页（预选对应增强工具），主页面保持不变", reversible: true, explore_status: observed}
          tips_toggle: {selector: "button:has-text('Tips For Becoming Better')", action_result: 展开/收起个人建议, reversible: true, explore_status: observed}

findings:
  bug_candidates:
    - id: portrait-dim-dropdown-no-descriptions
      source: v1
      requirement: 维度列表每项展示名称和一句话描述。
      actual: PC 端 10 个维度名称均存在，但未发现一句话描述。
      evidence: dimension_switch_inventory.json / 04_dimension_dropdown_open.png
      severity: needs_product_confirmation
    - id: portrait-dim-switch-mutates-hero-and-body
      source: v1
      requirement: 维度切换不应改变 SEO 原图与页面主体。
      actual: Ethnicity URL 切 Body Shape / Face Comparison 后原图变化，body hash 变化，URL 与 H1 不变。
      evidence: dimension_switch_inventory.json / 05_dimension_after_body_shape.png / 06_dimension_after_face_comparison.png
      severity: needs_product_confirmation
  corrected_false_positives:
    - 早期 v2/v3 因等待过短（5-9s）把 processing 误判为 result，误报「结果态控件缺失」和「结果态残留处理态文案」。延长等待 30-75s 后三页均真实出结果且控件齐全，两条已撤销。
  environment_notes:
    - 测试服登录提交后 authToken is empty 且网关 404；已切预部署登录成功。
    - 预部署结果生成网关 http://10.17.1.64:8088/gateway/pokecut/api/...（POST 200）。
    - 结果报告以 JPG 下载（Download report），结果图 blob 渲染。
  interaction_notes:
    - Unsaved Report 弹层 Download：下载 JPG 并关闭弹层留在结果态；之后 Upload another photo 直接回上传 UI。
    - Unsaved Report 弹层 Upload Without Saving：返回上传输入 UI（URL 加 ?detectSeoV3EntryInputPicker=body_shape），不下载。
    - 问卷 Maybe later：关闭问卷并出现常驻 feedback 按钮；之后 Download report 不再弹问卷。
    - 问卷 Submit（空选项）：无可见效果，问卷保持打开（疑需先作答 Q1/Q2/Q3）。
    - Try My Photo（body_shape 抽查 3 个）：点击新开标签页进入 /agent?pid=... 画布页（Free Infinite Canvas），预选对应增强工具（Clothes Changer / Hairstyle / Body 等），主页面 URL 与结果态不变。

coverage_boundary:
  covered:
    - 登录 + 服务器切换（测试服失败 -> 预部署登录成功）
    - 三页登录态初始态、上传缩略图态、processing 态、结果态
    - 结果态控件 Download report / Upload another photo / Try My Photo（新开 /agent 画布页）/ Tips
    - Ethnicity 上传自动出结果（~47s）
    - Body Shape 上传 + Continue 出结果（~30s）
    - Face Comparison A/B + Start Comparison 出结果（~75s）
    - Unsaved Report 弹层 Download（下载并关闭，留结果态）
    - Unsaved Report 弹层 Upload Without Saving（返回上传输入 UI）
    - 反馈问卷 Maybe later（关闭并出现常驻 feedback）
    - 反馈问卷 Submit（空提交无可见效果，问卷保持打开）
    - Try My Photo 抽查 3 个（body_shape，点击新开 /agent 画布页）
    - 无人脸 No Face Found 弹层（Change Photo 打开文件选择器 / Cancel 关闭）
    - 多人脸 Choose a Face to Analyze 弹层（虚线切换选中 + Continue 提交任务）
  not_in_this_round:
    - 反馈问卷 Q1/Q2/Q3 作答后 Submit 的完整提交
    - 未保存结果切换维度、移动端、异常素材
    - 其余两个页面（ethnicity / face_comparison）的 Unsaved Report / 问卷 / Try My Photo 交互


elements:
  seo_h1:
    selector: 'h1:has-text("Enhance Text in Image to 8K Online Free")'
    text: Enhance Text in Image to 8K Online Free
  desktop_upload_input:
    selector: '#singleUploadInput'
    input_type: file
    accept: image/jpeg,image/png,image/webp,image/bmp
    multiple: false
    description: PC 首屏/处理区单图上传入口
  mobile_upload_input:
    selector: '#file-upload'
    input_type: file
    multiple: false
    description: 移动端上传入口
  batch_upload_input:
    selector: '#batchUploadInput'
    input_type: file
    accept: image/jpeg,image/png,image/webp,image/bmp
    multiple: true
    description: Batch Edit 上传入口
  upload_drop_zone:
    selector: 'text=Drop, paste image, or URL'
  upload_button:
    selector: 'button:has-text("Upload Image")'
  batch_entry:
    selector: 'a[href="/batch-edit/edit"]:has-text("Batch Edit")'
  effects_title:
    selector: 'text=Choose the Effect'
  effects_multiselect_hint:
    selector: 'text=*Supports multiple selections'
  scales_title:
    selector: 'text=Upscale to'
  total_cost:
    selector: '[data-text-enhance-total-cost]'
    cost_state_attribute: data-text-enhance-cost-state
    observed_states:
      paid_number: '2/4/10/14'
      hidden_when_no_effect: true
  result_before_size:
    selector: 'text=Before :'
  result_now_size:
    selector: 'text=Now: :'
  processed_effect_notice:
    selector: 'text=Please note that this image has been processed these effect'
    status: not_reverified_in_current_run

effect_controls:
  enhance_text:
    selector: '[data-effect="enhance_text"]'
    text: Enhance Text
    selected_state: 'aria-pressed="true"'
    unselected_state: 'aria-pressed="false"'
    tooltip_selector: '[data-effect="enhance_text"] [data-effect-help-icon]'
    tooltip_text: Enhance blurry text and improve readability.
  remove_glare:
    selector: '[data-effect="remove_glare"]'
    text: Remove Glare
    selected_state: 'aria-pressed="true"'
    unselected_state: 'aria-pressed="false"'
    tooltip_selector: '[data-effect="remove_glare"] [data-effect-help-icon]'
    tooltip_text: Remove glare from reflective surfaces.
  remove_moire:
    selector: '[data-effect="remove_moire"]'
    text: Remove Moire
    selected_state: 'aria-pressed="true"'
    unselected_state: 'aria-pressed="false"'
    tooltip_selector: '[data-effect="remove_moire"] [data-effect-help-icon]'
    tooltip_text: Reduce moire patterns in screens or printed images.
  document_scanner:
    selector: '[data-effect="document_scanner"]'
    text: Document Scanner
    selected_state: 'aria-pressed="true"'
    unselected_state: 'aria-pressed="false"'
    tooltip_selector: '[data-effect="document_scanner"] [data-effect-help-icon]'
    tooltip_text: Turn a photographed document into a clean scanned page.

scale_controls:
  scale_2k:
    selector: 'p:text-is("2k")'
    detail_selector_text: '1536 * 2048 px / 2048 * 2048 px depending source image'
    selector_risk: 当前无 data-scale / role / aria-selected，必须限定在 Upscale to 区域内使用
  scale_4k:
    selector: 'p:text-is("4k")'
    detail_selector_text: '3072 * 4096 px / 4096 * 4096 px depending source image'
    selector_risk: 当前无 data-scale / role / aria-selected，必须限定在 Upscale to 区域内使用
  scale_8k:
    selector: 'p:text-is("8k")'
    detail_selector_text: '6144 * 8192 px / 8192 * 8192 px depending source image'
    selector_risk: 当前无 data-scale / role / aria-selected，必须限定在 Upscale to 区域内使用


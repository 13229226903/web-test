selector_semantic_gaps:
  - scale options lack data-scale / aria-pressed / data-selected; tests must scope to Upscale to region or request frontend semantic attributes
  - desktop/mobile primary controls are div elements with data-enhance-action, not button; tests must not use get_by_role(button) for primary Enhance
  - disabled primary currently inferred from cursor-not-allowed class; no aria-disabled
  - result Download/Edit More lack stable data-action attributes; tests need text selector scoped to result action area until frontend adds data-testid



notes:
  - en-US 下“纯色”显示为 Colorful Background；首卡 templateId=12_7_20240909。
  - 模板卡点击存在竞态：必须在点击前建立 file chooser 监听并选择文件，否则页面停留但已完成隐藏 input click；自动化需用 expect_file_chooser 包裹点击。
  - Insert 面板的可见子功能为 Upload(Image/My Cuts)、Draw(Text/General/Blur/Neno/Maker/Arrow/Dashed/Dotted)、Shape、Line；本次按需求覆盖前两项及相关参数。
  - 形状与线条的参数面板存在大量隐藏复用节点；自动化必须限定当前展开 section 后再取 `input[type=range]` / 色板 / 选项，不能用全页第一个 index。
  - 色板没有 aria/文本，按 palette 内元素 computed backgroundColor 精确选色。
  - 绘制必须使用最大可见 canvas 的 bounding box 进行鼠标拖动；canvas 不在 DOM 文本层。
  - Text 绘制默认 Contents=context、Size=69、Opacity=100；General 默认 Size=30、Opacity=100。
  - My Cuts 只能使用账号已有抠图列表，不用生成新业务数据。
  - 图片图层属性面板（v3 新增）：共 7 行 Opacity/Adjust/Shadow/Outline/Reflection/Filter/Blend；Shadow 子 tab 文本为 Effect/Color/3D Shadow。
  - 图片面板行内控件必须限定当前展开 section：页面同时挂载其他图层（形状/线条/文字）属性节点，全页 index 取到的是隐藏复用控件。
  - Outline Types 不是 `div.cursor-pointer`，而是 section 内 5 个 `div.rounded-full`（66x66）；色块是 `div.h-full.w-full`，需点其 `div.cursor-pointer` 祖先，直接点可能弹出调色板 overlay。
  - Filter 强度必须在“固定同一滤镜项”的前提下比较才正确；跨滤镜项对比会误判为无差异。强度=0 时画布 hash 与未加滤镜基准一致。
  - 图片图层 Reflection 的倒影渲染在**图片下方**；若图片铺满整张画布，倒影落在可见区域之外，会误判为“无效果”。正确验证方式：先选中图片，拖动四角 `span.scale-point` 锚点向选择框中心缩小图片，再开启 Reflection。缩小后开启差异 1.742%，改为 80/80/60/120 后差异 4.711%，图片下方可见明显镜像（shots/65_reflection_*.png）。
  - 图层缩放锚点：`span.scale-point`（16x16 白底圆点，类名含 left/right/top/bottom + cursor-*-resize）；按住沿对角线拖向中心即缩小。
  - v3 图片面板证据：shots/61_image_baseline.png、61_image_opacity_35.png、61_image_adjust_00.png ~ 61_image_adjust_12.png、61_image_adjust_all.png、61_image_shadow_effect_changed.png、62_image_shadow_*.png、62_image_outline_*.png、61_image_reflection_changed.png、61_image_filter_thumb.png、63_image_f2_s*.png、61_image_blend_*.png；explore_62_image_params_final.json、explore_64_targeted_validation.json、explore_65_filter_strength.json。
  - - 旧画布绘制态的 Apply / Cancel 是 `div`（`Cancel` 为 `div.w-[calc(100%-2.5rem)] h-[3.75rem] bg-c-light-purple`，`Apply` 同构），**不是 `button`**； 定位时不能写死 `button` 标签，应遍历可见文本元素取中心坐标后 `page.mouse.click(x, y)`，并优先取 `x<600` 的左侧工具栏目标；退出判据：左侧可见 Apply 控件消失（而非仅断言某个 button 计数为 0）。来源：2026-09-10 任务实测，2026-09-11 复跑 24/24 通过。

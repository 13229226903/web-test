# Pokecut Infinite Canvas - Sticker Panel (Legacy / zh-CN)
# Version: v1
# Explored: 2026-09-11, http://10.17.1.66:3001/zh/template, VIP 450832596@qq.com
page: Infinite Canvas Sticker Panel
url: /zh/create/edit?pid=<uuid>#
landmark:
  selector: 'div.h-\[calc\(100vh-5rem\)\].w-\[25rem\]:has(img[src*="/source/sticker/thumb/"])'
  description: 旧画布左侧 Sticker 素材面板；当前显示贴纸分类与缩略图。
entry:
  from: /zh/template
  trigger: >-
    在中文模板页进入“纯色”分组，点击第一张模板卡；先监听 file chooser，再选择
    test_images/1K.jpg。任务完成后进入旧画布。
  selector: 'h3:text-is("纯色")'
  template_card:
    selector: 'div.mb-\[0\.5rem\]:has(h3:text-is("纯色")) div.relative.flex.w-\[9\.625rem\].cursor-pointer'
    click_target: 'div.absolute.left-0.top-0.flex.size-full.items-center > div'
    template_id: 12_7_20240909
  file_selector: 'input[type=file]'
  after_upload: /zh/create/edit?pid=<uuid>#

elements:
  left_nav:
    selector: 'div.flex.w-\[5rem\].flex-shrink-0.flex-col'
    description: 旧画布左侧垂直功能栏；Sticker 为第 7 项，图标 src 为 edit_left_tab_btn_sticker.svg。
  sticker_tab:
    selector: 'div.cursor-pointer:has(> img[src$="edit_left_tab_btn_sticker.svg"])'
    role_or_text: Sticker / 贴纸
    description: 点击后展开左侧贴纸素材面板；当前页显示中文文案“贴纸”。
  sticker_panel:
    selector: 'div.h-\[calc\(100vh-5rem\)\].w-\[25rem\]:has(img[src*="/source/sticker/thumb/"])'
    description: 宽 400px 的贴纸目录；顶部为分类轨道，下方为当前分类缩略图。
  sticker_category_rail:
    selector: 'div.h-\[calc\(100vh-5rem\)\].w-\[25rem\]:has(img[src*="/source/sticker/thumb/"]) .mel-scrollbar__view > div > div:first-child'
    description: 分类文本轨道，可见项包括 情人节1、情人节2、新年、简单、数字、卡通、室内、海滨、报纸拼贴、复古等。
  first_sticker_thumbnail:
    selector: 'img[src$="thumb_sticker_valentine1.webp"]'
    role_or_text: 情人节1 首张 Love sticker
    description: 本次范围固定的第一个贴纸素材；点击后新增并自动选中该贴纸图层。
  main_canvas:
    selector: canvas
    description: 旧画布编辑区；探索时可见面积最大的 canvas 为 1039x1000（1920x1080 viewport）。
  right_property_panel:

notes:
  - 本次任务只验证一个贴纸（情人节1 首张 thumb_sticker_valentine1.webp）及其右侧调参面板，不扩展到其它贴纸素材、Layer 管理、保存或下载。
  - 旧的图片属性面板与本贴纸面板结构大体同构，但贴纸面板实际只有 7 行，无 Background；阴影为 3 个效果 range，另有位置/颜色子页。
  - 右侧属性行必须限定在 x>1500 且宽约 400px 的可见属性面板内；页面挂载多套隐藏复用节点。
  - 属性行定位：`div.cursor-pointer:has(> p:text-is("<分区名>"))`；内容区为行的直接相邻兄弟 div。
  - 阴影、轮廓、反射、滤镜、混合 switch 使用 `input[type=checkbox]` + `span.slider`；开关 ON 可能自动展开当前分区。
  - 滤镜缩略图真实选择需用 Playwright 鼠标点击，直接 DOM `click()` 可出现选中样式但不触发画布重渲染。
  - Filter strength range 在部分渲染阶段 `offsetParent` 为 null，但 bounding box 可见；可见性过滤需用 box 判断。
  - 证据截图按两类保存：用户可复核的全页面图在 `shots/`；像素比对用 canvas 裁切图在 `evidence/mcp-output/`，不将后者作为页面结构证据。

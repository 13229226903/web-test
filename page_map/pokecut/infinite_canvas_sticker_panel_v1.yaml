    url_or_state_key: 右侧面板可见“不透明度”且 Sticker 图层处于选中状态
    buttons:
      sticker_opacity_row:
        selector: 'div.cursor-pointer:has(> p:text-is("不透明度"))'
        role_or_text: 不透明度
        visible_condition: 贴纸已选中
        enabled_condition: 始终可展开
        action_result: 展开后显示唯一 range；默认 100，实测 100→35 贴纸透明度下降。
        reversible: true
        explore_status: covered
        dependencies: []
        assertions_hint: 'range min=0 max=100；100→35 和 100→0 的画布差异均 > 2%。'
        notes: >-
          实测 100→35 阈值差异 2.172%，100→0 差异 2.202%；
          证据 shots/sticker_panel_opacity_100_zh.png、sticker_panel_opacity_35_zh.png、sticker_panel_opacity_0_zh.png。
      sticker_adjust_row:
        selector: 'div.cursor-pointer:has(> p:text-is("调整"))'
        role_or_text: 调整
        visible_condition: 贴纸已选中
        enabled_condition: 可展开
        action_result: 展开 13 个调色 range，按顺序为 亮度/对比度/鲜艳度/饱和度/曝光/高光/阴影/清晰度/锐化/色温/色调/颗粒/暗角。
        reversible: true
        explore_status: covered
        dependencies: []
        assertions_hint: >-
          13 个 range 的值域依次为 -100~100、-100~100、-100~100、-100~100、-100~100、-100~100、-100~100、
          0~100、0~100、-100~100、-100~100、0~100、-100~100；每项从 0 改到正值后画布像素均值均非零变化。
        notes: >-
          实测 13 项均改变画布像素数据；强差异低于 0.1 个百分点阈值的项为鲜艳度(0.020%)、曝光/高光/阴影/锐化/色温/色调/颗粒(约 0%)、清晰度(0.007%)、暗角(0.139%)，但原始像素均值均 >0。

    buttons:
      sticker_first_thumbnail:
        selector: 'img[src$="thumb_sticker_valentine1.webp"]'
        role_or_text: 情人节1 / Love sticker
        visible_condition: Sticker 面板打开且情人节1 分类已加载
        enabled_condition: 已登录并进入可编辑画布
        action_result: 点击后新增一个贴纸图层并自动选中；画布出现选择框和四角缩放锚点，左侧面板保持贴纸目录。
        reversible: true
        explore_status: covered
        dependencies: [VIP 账号, test_images/1K.jpg, 模板入口任务已完成]
        assertions_hint: 画布新增贴纸可见；右侧出现 7 个属性分区；Layer 列表中贴纸图层数量为 1。
        notes: 证据 shots/sticker_panel_opacity_100_zh.png、shots/sticker_panel_opacity_expanded_zh.png。

  sticker_selected:
    description: >-

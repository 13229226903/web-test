# Pokecut Infinite Canvas Optimization - page map v1
# 采集环境: 测试服 http://10.17.1.66:3001，PC 1440x900，desktop UA / pointer fine
# 入口: /create -> Start from a Photo -> test_images/1K.jpg -> /agent?pid=<uuid>
# 采集时间: 2026-09-22
page: Infinite Canvas Optimization
url: /agent?pid=<uuid>
landmark:
  selector: "button[aria-label='Rotation'], button[data-rotate-handle='true']"
  description: 无限画布选中图层后出现的旋转控制
entry:
  from: /create
  trigger: 点击 Start from a Photo 后选择 test_images/1K.jpg
  selector: "button:has-text('Start from a Photo')"
  file_chooser: true
elements:
  canvas_stage:
    selector: "div.absolute.inset-0.overflow-visible"
    description: 无限画布主区域
  canvas_layer_image:
    selector: "div[data-element-id] img[alt='图片 1']"
    description: 上传图片图层；实际交互点击其 data-element-id 容器
  canvas_layer_result_remove_bg:
    selector: "img[alt*='Remove BG']"
    description: Remove BG 结果图层
  canvas_layer_text:
    selector: "img[alt^='文字']"
    description: 文字图层渲染图
  recent_used_row:
    selector: "div:has-text('Inspiration'):has-text('Crop'):has-text('Remove BG')"
    description: 底部 textbox 上方最近使用区域；本次出现 Inspiration / Crop / Remove BG
  create_recently_used:
    selector: "text=Recently Used"
    description: Create 页最近使用区块，离开画布后展示 Crop / Remove BG
states:
  create_entry:
    description: Create 页 PC 布局，可点击 Start from a Photo 触发文件选择器
    trigger: 打开 /create
    url_or_state_key: /create
    buttons:
      start_from_photo:
        selector: "button:has-text('Start from a Photo')"
        role_or_text: Start from a Photo
        visible_condition: PC Create 页 Trending Tools 已渲染
        enabled_condition: 始终可点击
        action_result: 触发浏览器 file chooser；选择 test_images/1K.jpg 后进入 /agent?pid=*
        reversible: true
        explore_status: covered
        dependencies: [test_images/1K.jpg]
        assertions_hint: file chooser 出现且 URL 跳到 /agent?pid=*
        notes: 进入前若出现语言提示或定价遮罩，应按页面实际处理，不能直接注入 file input。
  canvas_default_image_selected:
    description: 上传后图片图层默认选中，顶部工具栏、Rotation、底部生成输入区可见
    trigger: 上传 test_images/1K.jpg
    url_or_state_key: /agent?pid=<uuid>

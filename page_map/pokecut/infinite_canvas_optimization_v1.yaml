notes:
  - PC 布局需确保 desktop UA / pointer fine；本会话曾继承 iPhone emulation，已通过浏览器上下文初始化覆盖为 PC 口径。
  - 页面 HTTP 非 secure context 下 crypto.randomUUID 不可用，影响部分 Background 面板打开。
  - 键盘移动实测为屏幕坐标 1px/10px，而不是随缩放变化的画布坐标移动。
  - Enhance 统计事件名与需求不同：实际 *_点击，需求 *_使用。
  - Seedream 4.0 页面文案为 Seedream4.0，存在文案差异候选。

        selector: "button[aria-label='Remove BG'], button:has-text('Remove BG')"
        role_or_text: Remove BG
        visible_condition: 图片图层被选中
        enabled_condition: 图片图层可编辑
        action_result: 打开 Remove Background 面板
        reversible: true
        explore_status: covered

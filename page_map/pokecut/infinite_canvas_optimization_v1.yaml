        enabled_condition: 图片图层可编辑
        action_result: 打开 Enhance 模型下拉；点击模型后打开对应 AI Enhancer 面板
        reversible: true
        explore_status: covered
        dependencies: [test_images/1K.jpg]
        assertions_hint: 出现 Standard Mode / Old Photo Mode / Portrait Mode / Text Mode / Ultra HD Mode
        notes: 需求埋点期望 无限画布Enhance_xx使用；实测 Standard Mode 为 无限画布Enhance_Standard Mode点击。

        notes: ''
  empty_or_single_upload:
    description: 上传 <2 张图时停留 /batch 并弹提示
    trigger: 上传 0 或 1 张有效图片
    url_or_state_key: /batch
    buttons: {}
    notes: toast 文案 key = text.batchUploadMinImagesToast；不进入 /agent


        notes: ''
      tab_erase:
        selector: '[role=tab]:has-text("Erase")'
        role_or_text: tab / Erase
        visible_condition: batch edit dialog
        enabled_condition: always
        action_result: 切换到 Erase 面板
        reversible: true
        explore_status: covered
        dependencies: [batch edit dialog]
        assertions_hint: aria-selected=true
        notes: ''
      tab_crop:
        selector: '[role=tab]:has-text("Crop")'
        role_or_text: tab / Crop
        visible_condition: batch edit dialog
        enabled_condition: always
        action_result: 切换到 Crop 面板
        reversible: true
        explore_status: covered
        dependencies: [batch edit dialog]
        assertions_hint: aria-selected=true
        notes: ''
      tab_clothes_changer:
        selector: '[role=tab]:has-text("Clothes Changer")'
        role_or_text: tab / Clothes Changer
        visible_condition: batch edit dialog
        enabled_condition: always
        action_result: 切换到 Clothes Changer 面板
        reversible: true

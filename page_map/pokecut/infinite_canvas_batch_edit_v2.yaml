# 版本说明: 本文件为 infinite_canvas_batch_edit_v1.yaml 的下一版（2026-11-03 重基线）。
# 入口变更：旧 /batch-edit/edit 已废弃，改由 /batch 上传 >=2 张进入 /agent?pid=* 并自动展开 Batch Edit。
page: InfiniteCanvasBatchEditPanel
url: /agent?pid=*
landmark:
  selector: '[role=dialog] h2:has-text("Batch Edit")'
  description: 无限画布上的 Batch Edit 弹窗；从 /batch 上传 >=2 张图片后自动展开
entry:
  from: http://10.17.1.66:3001/batch
  trigger: 点击 Try Now 卡片或 Upload Images 上传 >=2 张图片
  selector: '#file-upload'
  note: 主按钮默认 Remove BG；Try Now 卡片决定进入后选中的 tab；上传 <2 张停留 /batch
elements:
  batch_edit_entry:
    selector: button:has-text('Batch Edit')
    text: Batch Edit
    description: 画布工具栏上的 Batch Edit 入口；从 /batch 进入时弹窗已自动展开
  close:
    selector: button:has-text('text.batchEditClose')
    description: Batch Edit 弹窗右上角关闭按钮
  help:
    selector: 'button:has-text("Apply the same edit to multiple photos at once")'
    description: Batch Edit 标题右侧帮助按钮，弹层内含引导视频
  submit_remove_bg:
    selector: 'button:has-text("Remove Background")'
    text: Remove Background
    description: Remove BG 提交按钮
  submit_enhance:
    selector: 'button:has-text("Enhance")'
    text: Enhance
    description: Enhance 提交按钮（tab 与提交按钮同名，需取 dialog 内最后一个）
  submit_erase:
    selector: 'button:has-text("Remove")'
    text: Remove
    description: Erase 提交按钮
  submit_crop:
    selector: 'button:has-text("Apply")'
    text: Apply
    description: Crop 提交按钮
  submit_clothes:
    selector: 'button:has-text("Generate")'
    text: Generate
    description: Clothes Changer 生成按钮；未选模板时 disabled
  submit_watermark:
    selector: 'button:has-text("Apply")'
    text: Apply
    description: Watermark 应用按钮；未上传水印时 disabled
  watermark_upload:
    selector: 'button:has-text("Upload Your Watermark")'
    text: Upload Your Watermark
    description: Watermark tab 上传水印入口
tabs:
  main:
    - Enhance
    - Remove BG
    - Change BG
    - Erase
    - Crop
    - Clothes Changer
    - Watermark
  change_bg_sub:
    - Colors
    - Images
  erase_sub:
    - Face
    - Body
    - Mark
    - Object
    - Other
  clothes_categories:
    - Dresses
    - Casual Wear
    - Bikinis
    - Formal Wear
    - Lingerie
    - Festive
    - Tops
    - Kids Wear
    - Outerwear
    - Wedding Dress
    - Men's Wear
    - Winter

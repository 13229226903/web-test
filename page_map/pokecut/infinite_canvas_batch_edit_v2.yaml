# ── 2026-11-03 第二轮：提交任务与结束态（VIP 实测）──
submit_flows:
  account: VIP 450832596@qq.com (User8JY)
  environment: test http://10.17.1.66:3001
  note: 多模式 tab 只选一种、多预设 tab 只选一个预设提交；每次提交后轮询到 taskflow complete
  remove_bg:
    input: 2 张图片图层
    selection: General（默认一种模式）
    submit: button.canvas-batch-submit / Remove Background
    task_id_pattern: gzy_removebg_PokeCutWeb_<ts>_<rand>_cross
    consumed_credits: 0（VIP）
    result: 生成成功；处理完成后图层替换为抠图结果，画布尺寸不变
    stats_events: [画布批量_Remove BG功能开始处理, 画布批量_Remove BG功能处理成功率95_100, 画布批量_Remove BG功能处理完成]
  enhance:
    input: 2 张图片图层
    selection: Standard Mode（默认一种模式）
    submit: button.canvas-batch-submit / Enhance
    task_id_pattern: gzy_picenhance_PokeCutWeb_<ts>_<rand>_dev_cross
    consumed_credits: 0（VIP）
    result: 生成成功；画布尺寸从 3970x4096 -> 5162x4096（分辨率提升）
    stats_events: [画布批量_Enhance功能处理成功率95_100, 画布批量_Enhance功能处理完成]
  change_bg:
    input: 2 张图片图层（需先抠图）
    selection: Colors 子 tab 选择 #000000（一种预设色）
    submit: 无独立提交按钮，选色即时应用并触发后端处理
    result: 生成成功；画布尺寸不变
    stats_events: [画布批量_Change BG功能处理完成]
  erase:
    input: 2 张图片图层
    selection: Face > Remove Acne（默认一种）
    submit: button.canvas-batch-submit / Remove
    task_id_pattern: gzy_comfytextart_PokeCutWeb_<ts>_<rand>_cross
    consumed_credits: 0（VIP）
    result: 生成成功；画布尺寸不变
    stats_events: [画布批量_Erase功能处理成功率95_100, 画布批量_Erase功能处理完成]
  crop:
    input: 2 张图片图层
    selection: Template > Amazon 2000x2000px（一个预设）
    submit: button.canvas-batch-submit / Apply
    result: 无后端任务；即时应用；画布尺寸 4032x2000
    stats_events: []
  clothes_changer:
    input: 2 张图片图层
    selection: Dresses（默认分类）首个模板（一个预设）
    submit: button.canvas-batch-submit / Generate
    task_id_pattern: gzy_comfytextart_PokeCutWeb_<ts>_<rand>_cross
    consumed_credits: 0（VIP）
    result: 首次提交返回 Network error（环境波动，非用例目标）；按要求不覆盖失败态，仅验证重试后正向生成成功
    stats_events: [画布批量_Clothes Changer功能处理成功率30_60, 画布批量_Clothes Changer功能处理完成]
  watermark:
    input: 2 张图片图层 + 上传水印 test_images/低分辨率.JPG
    selection: 默认 Location Top Left（一个位置）
    submit: button.canvas-batch-submit / Apply
    result: 上传水印后自动抠图（taskId gzy_removebg_...），Apply 生成成功；画布尺寸不变
    stats_events: [画布批量_Watermark功能开始处理, 画布批量_Watermark功能处理成功率95_100, 画布批量_Watermark功能处理完成]
states_extra:
  agent_batch_processing:
    description: 提交后处理中状态
    trigger: 点击任一提交按钮
    url_or_state_key: /agent?pid=*
    observable:
    - 画布出现 "Thinking..." 进度占位
    - 队列日志 [CanvasBatch][Queue] occupiedSlots 0->1
    - 轮询 aigc-task-poll
    exit_when: [taskflow-result-file stage=complete status=success, CanvasBatch Queue occupiedSlots 1->0]

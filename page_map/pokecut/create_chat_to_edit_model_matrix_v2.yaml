# Create 页 / Agent 页 - Chat to Edit 模型矩阵页面地图 v2
# 基于 create_chat_to_edit_auto_v1.yaml 增量；新增多模型模式、Settings、agent 入口、DEBUG 前置条件
# 采集环境: http://10.17.1.66:3001，PC 1920x1080，en-US，VIP 450832596@qq.com (User8JY)
# 采集时间: 2026-11-03 ~ 2026-11-04
page: Create Chat to Edit Model Matrix
url: /create
landmark:
  selector: "h2:has-text('Chat to Edit')"
  description: Create 页顶部 Chat to Edit 区块；agent 页底部同一组件
entry:
  create:
    from: Login / Home / Direct URL
    trigger: 登录后访问 /create
    selector: "h2:has-text('Chat to Edit')"
  agent:
    from: /create
    trigger: 点击 button "Start with Photos" → 选图 → 跳转 /agent?pid=*
    selector: "button:has-text('Start with Photos')"
    note: agent 页底部输入区与 /create 同组件（textarea / Model / Setting / Upload reference images）

# ── 关键前置条件（所有生成用例必做） ──
preconditions:
  official_fallback_upload:
    description: 提交任务前必须把「测试服兜底上传地址」切到「正式」，否则出图会因兜底上传走内网而失败
    steps:
    - 点击页面右下角 button "DEBUG"
    - Debug 面板 → heading "测试服兜底上传地址" → 点击 button "正式"
    - 关闭 Debug 面板
    selector:
      debug_button: "button:has-text('DEBUG')"
      heading: "h4:has-text('测试服兜底上传地址')"
      official_button: "h4:has-text('测试服兜底上传地址') + * button:has-text('正式')"
    official_url: "https://appinference-upload.flockiaapps.com"
    caveat: 刷新后恢复「内网」，每次刷新/重载后必须重新设置
    evidence: artifacts/2026-11-03_create_agent_model_matrix/shots/22_agent_pokecutpro_t2i_x2_official_upload.png

elements:
  chat_to_edit_prompt:
    selector: "textarea[placeholder='What do you want to design today?']"
    description: Chat to Edit prompt 输入框（/create 与 agent 底部组件）
    notes: 需要真实键盘输入才会启用提交按钮（JS 直接赋值可能不触发）
  upload_reference_images:
    selector: "div[title='Upload reference images']"
    description: 上传参考图入口
    notes: 图生图参考图统一用 test_images/低分辨率.JPG（63KB）
  model_selector:
    selector: "div[title='Model']"
    description: 模型选择器（默认 Nano Banana 2 Lite）
  setting_selector:
    selector: "div[title='Setting']"
    description: Settings 面板入口；含 Output Ratio / Output Resolution / Number of images
  submit_button:
    selector: "div.cursor-pointer:has(img[src*='create_chat_send_btn.svg'])"
    description: 发送任务按钮；有任务处理中时为 create_chat_send_btn_disable.svg（禁用）
  model_multi_mode_switch:
    selector: "switch[name='Model Multi Mode'], [role=switch]"
    description: 模型选择弹窗顶部「Model Multi Mode」开关
    note: 开启后模型列表变为可多选

model_list:
  single_mode:
    - Auto
    - Pokecut Pro
    - Nano Banana 2 Lite
    - Nano Banana Pro
    - Nano Banana 2
    - ChatGPT Image 2.5-flare
    - ChatGPT Image 2.5-Sunburst
    - ChatGPT Image 2.0
    - Seedream 5.0 Pro
    - Seedream 5.0 Lite
    - Seedream4.0
  multi_mode:
    - Pokecut Pro
    - Nano Banana 2 Lite
    - Nano Banana Pro
    - Nano Banana 2
    - ChatGPT Image 2.0
    - Seedream 5.0 Pro
    - Seedream 5.0 Lite
    - Seedream4.0
  multi_mode_first_four:
    - Pokecut Pro
    - Nano Banana 2 Lite
    - Nano Banana Pro
    - Nano Banana 2
  selected_indicator:
    selected_icon: "/icons/svg/purchase_selected_point.svg"
    unselected_icon: "/icons/svg/purchase_select_point.svg"

settings:
  output_ratio: ["1:1", "3:4", "4:3", "9:16", "16:9", "2:3", "3:2"]
  output_resolution: ["1K"]  # agent 页另有 2K（localStorage ai-image-resolution:infinite-canvas=2k）
  number_of_images: ["1", "2", "3", "4"]

states:
  create_text_to_image:
    description: /create 文生图（仅 prompt，无参考图）
    trigger: /create + prompt + 提交
    url_or_state_key: /create
    buttons:
      model_selector:
        selector: "div[title='Model']"
        role_or_text: Model
        visible_condition: 页面加载后可见
        enabled_condition: 始终
        action_result: 展开模型选择弹窗
        reversible: true
        explore_status: covered
        dependencies: []
        assertions_hint: 默认文案为 Nano Banana 2 Lite
        notes: ""
      submit:
        selector: "div.cursor-pointer:has(img[src*='create_chat_send_btn.svg'])"
        role_or_text: 提交图标
        visible_condition: prompt 有内容后出现
        enabled_condition: prompt 非空且无任务处理中
        action_result: 提交任务并跳转 /agent?pid=*
        reversible: false
        explore_status: covered
        dependencies: ["model_selector"]
        assertions_hint: 提交后 handleSubmitTask result resultCode=100

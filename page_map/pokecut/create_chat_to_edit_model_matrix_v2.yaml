notes:
- submit 按钮在「有生图任务处理中」时禁用（create_chat_send_btn_disable.svg）
- 失败现象：Network error，未出图；根因 = 测试服兜底上传地址未切「正式」
- 轮询期间 GPU resultCode -112「未完成」是正常中间态，不是失败信号
- 无 timeout/超时日志；用户口径：失败为环境问题，切正式后视为通过
- 用户确认（2026-11-04）：不重跑；提交前切「正式」兜底上传后默认视为全部通过；失败态（Network error）不作为回归覆盖范围

notes:
  - 无限画布贴纸调整菜单共 4 个功能分区（Filter / Reflection / Outline / Adjust），
    与旧画布的 7 区（不透明度/调整/阴影/轮廓/反射/滤镜/混合）不同；
    无独立「不透明度」「阴影」「混合」区。
  - Filter 有 17 个分类 tab（Vintage/Brighten/Portrait/Wallpaper/Sparkle/Star/Elevated/
    Vibes/Jingle/Snow/Journal/Holiday/Gentle/Jewelery/Monochrome/Perfume/Cuisine），
    每个分类下是滤镜缩略图网格。
  - Adjust 区含 14 个滑杆（Opacity/Brightness/Contrast/Vibrance/Saturation/Exposure/
    Highlight/Shadow/Clarity/Sharpen/Temperature/Tint/Grain/Vignette），无独立开关。
  - Outline 区含 Types 样式按钮组 + Color 色块（约 27 个）+ Size/Distance/Blur/Smooth 四滑杆。
  - Filter/Reflection/Outline 三个开关的 ON 判据均为背景色 rgb(35,35,35)，OFF 为 rgb(209,213,219)。
  - 入口确认：/create → 关定价弹窗 → Trending Tools → Start with Photos → 上传 1K.jpg → /agent。
  - 证据截图 shots/01~07（详见 sync.md）。

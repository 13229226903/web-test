# Pokecut 无限画布 - 贴纸功能与调整菜单（legacy canvas v2）
# Version: v2
# Explored: 2026-10-15, http://10.17.1.66:3001/agent?pid=689a9195-714b-4732-91b4-a1e42e7b9565#
page: Infinite Canvas Sticker Panel
url: /agent?pid=<uuid>#
landmark:
  selector: "div:has-text('Add Sticker')"
  description: 无限画布左侧工具栏第 3 个按钮（Add Sticker）；悬浮后弹出贴纸面板。
entry:
  from: /create
  trigger: >-
    关闭定价弹窗 → Trending Tools 分类 → 点击第一个按钮 Start with Photos →
    文件选择器 → 选 test_images/1K.jpg → /agent?pid=<uuid>#
  selector: "button:has-text('Start with Photos')"
  file_chooser: true
  after_upload: /agent?pid=<uuid>#

elements:
  left_toolbar:
    selector: "div:has(button[tooltip='Add Sticker'])"
    description: 无限画布左侧竖向工具栏；第 3 个为 Add Sticker。
  add_sticker_button:
    selector: "button:has-text('Add Sticker')"
    role_or_text: Add Sticker
    description: >-
      左侧第 3 个按钮；hover 展开贴纸面板（含分类 tab 与缩略图网格）。
      tooltip 文本为 'Add Sticker'。
  sticker_panel:
    selector: "div:has-text('Valentine1')"
    description: >-
      hover Add Sticker 后弹出的贴纸面板；
      顶部为分类 tab（Valentine1/Valentine 2/New Year/Basic/Numbers/Cartoon/Indoor/
      Sea/Newspaper/Vintage/Flower/Leaves/Jewelry/Pink/Shells&Pearls/Y2K Alphabet/
      Colorful Shine/Bling Bling/Neon Alphabet/Booth/Window/Foundation/Lipstick/Gift/
      New Sales/Sales/Black Friday/Rating/Likes/Device/Cute Food/Lovely Headgear/
      Animals/Doll/Cartoon2/Decorative/Bathroom/Kitchen/Fruit/Free Shipping/COD/
      Fast Delivery/Social Media/Call To Action/Emoji/Facebook likes/Comic decoration/
      Polaroid/Rainbow Light/Surprise Graffiti/Marker Graffiti/Shape/Shadow/Chat Bubble/
      Easter/Watercolor Brush/Painting Shape/Curves/Shape Scenery/Christmas/Chrismas 2/
      Chrismas 3/Halloween/Halloween 2/E-Commerce/ThanksGiving 等 60+ 分类），
      下方为当前分类缩略图网格。
  sticker_thumbnail:
    selector: "img[alt='sticker_valentine1']"
    role_or_text: Valentine1 分类第一个贴纸
    description: 点击后在画布新增贴纸图层并自动选中。
  sticker_layer_toolbar:
    selector: "div:has(button:has-text('Adjust'))"
    description: >-
      贴纸选中时画布上方浮动工具栏：
      Adjust / Move Up / Move Down / To Top / To Bottom / Flip h / Flip v / Delete
  adjust_button:
    selector: "button:has-text('Adjust')"
    role_or_text: Adjust
    description: 点击后打开右侧调整菜单（Filter / Reflection / Outline / Adjust 四区）。

modals: {}

states:
  sticker_panel_hover:
    description: hover Add Sticker 后的贴纸面板展开态
    trigger: 鼠标悬浮左侧第 3 个按钮（Add Sticker）
    url_or_state_key: /agent?pid=<uuid># 且左侧出现分类 tab + 缩略图网格
    buttons:
      sticker_category_tab:
        selector: "button:has-text('Valentine1')"
        role_or_text: 贴纸分类名
        visible_condition: 贴纸面板展开
        enabled_condition: 恒可用
        action_result: 切换分类；下方网格刷新为该分类缩略图
        reversible: true
        explore_status: covered
        assertions_hint: 分类 tab 高亮态为 bg-[#232323] text-white
      sticker_first_thumbnail:
        selector: "img[alt='sticker_valentine1']"
        role_or_text: sticker_valentine1
        visible_condition: Valentine1 分类已选中
        enabled_condition: 恒可用
        action_result: 点击后在画布新增贴纸图层并自动选中；贴纸浮动工具栏出现
        reversible: true
        explore_status: covered
        dependencies: [已进入无限画布]
        assertions_hint: 画布出现新贴纸图层；浮动工具栏 8 个按钮可见

  sticker_selected:
    description: 贴纸选中后的画布 + 浮动工具栏
    trigger: 点击画布上的贴纸（或添加贴纸后自动选中）
    url_or_state_key: 画布上方出现 Adjust/Move Up/Move Down/To Top/To Bottom/Flip h/Flip v/Delete
    buttons:
      adjust_entry:
        selector: "button:has-text('Adjust')"
        role_or_text: Adjust
        visible_condition: 贴纸已选中
        enabled_condition: 恒可用
        action_result: 点击后打开右侧调整菜单（Filter/Reflection/Outline/Adjust 四区）
        reversible: true
        explore_status: covered
        assertions_hint: 右侧面板出现 4 个分区标题

  adjust_menu_open:
    description: 右侧调整菜单展开态（4 个功能分区）
    trigger: 点击贴纸浮动工具栏 Adjust
    url_or_state_key: 右侧出现 Filter/Reflection/Outline/Adjust 四个分区
    buttons:
      filter_switch:
        selector: "div.relative.inline-flex"
        role_or_text: Filter 开关
        visible_condition: 调整菜单打开
        enabled_condition: 恒可用
        action_result: 切换滤镜启用/禁用；ON 时展开分类 tab + 滤镜网格 + Strength 滑杆
        reversible: true
        explore_status: covered
        assertions_hint: ON 背景色 rgb(35,35,35)，OFF rgb(209,213,219)
      filter_category_tab:
        selector: "button:has-text('Vintage')"
        role_or_text: Vintage / Brighten / Portrait 等 17 个分类
        visible_condition: Filter 开关 ON 且已展开
        enabled_condition: 恒可用
        action_result: 切换滤镜分类；网格刷新为该分类下的滤镜缩略图
        reversible: true
        explore_status: covered
        assertions_hint: 分类 tab 选中态 bg-[#232323] text-white
      filter_tile:
        selector: "img[alt='90s']"
        role_or_text: 90s / CCD / Digicam / Y2k / VI03 等
        visible_condition: 分类已选中
        enabled_condition: 恒可用
        action_result: 选中该滤镜；Strength 滑杆出现
        reversible: true
        explore_status: covered
        assertions_hint: 缩略图选中态 border-[#3338EE]
      filter_strength_slider:
        selector: "input[type=range]"
        role_or_text: Strength
        visible_condition: 滤镜已选中
        enabled_condition: 恒可用
        action_result: 调整滤镜强度
        reversible: true
        explore_status: covered
        assertions_hint: min=0 max=100 step=1 默认 100

      reflection_switch:
        selector: "div.relative.inline-flex"
        role_or_text: Reflection 开关
        visible_condition: 调整菜单打开
        enabled_condition: 恒可用
        action_result: ON 时展开 Opacity/Scope/Distance/Angle 四个滑杆
        reversible: true
        explore_status: covered
        assertions_hint: ON 背景色 rgb(35,35,35)
      reflection_opacity_slider:

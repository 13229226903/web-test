        assertions_hint: 绘制前后 canvas 截图 hash 不同。
        notes: 证据 evidence/explore_54_general_apply.json。
      draw_general_apply:
        selector: 'div.cursor-pointer:has-text("Apply")'
        role_or_text: Apply
        visible_condition: 常规绘制态
        enabled_condition: 至少产生一处笔触后
        action_result: 提交笔触并退出绘制态；保留新的绘制图层。
        reversible: true
        explore_status: covered
        dependencies: []
        assertions_hint: Apply 后仍可见 Insert 面板和图层控制框。
        notes: 证据 shots/55_general_apply_committed.png。
      draw_general_cancel:
        selector: 'div.cursor-pointer:has-text("Cancel")'
        role_or_text: Cancel
        visible_condition: 常规绘制态
        enabled_condition: 始终可用
        action_result: 放弃未提交的笔触。
        reversible: true
        explore_status: covered
        dependencies: []
        assertions_hint: Cancel 后未提交笔迹不应保留。

        assertions_hint: Fill 色板 28 个可点击项；颜色块可通过 computed backgroundColor 精确匹配。
        notes: 证据 shots/22_shape_fill_expanded.png、30_shape_fill_black.png。
      shape_fill_image:
        selector: 'button:text-is("Image")'
        role_or_text: Image fill
        visible_condition: Fill 展开
        enabled_condition: 画布可编辑
        action_result: 打开 Image/Cutouts 素材库；Image 页首个 Upload 打开 file chooser，选择 test_images/有人脸.JPG 后按原图铺入形状并保持形状选中。
        reversible: true
        explore_status: covered
        dependencies: [test_images/]
        assertions_hint: Fill 展开后出现蓝色 Image 按钮。
        notes: 实测 fc_ok=true，图片填充后右侧新增 Adjust 行；证据 shots/56_shape_fill_image.png、57_shape_fill_image_applied.png。
      shape_corner_row:

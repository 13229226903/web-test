        role_or_text: Border width
        visible_condition: Border 展开
        enabled_condition: Border 开启
        action_result: 0~100；实测 20 后边框明显变粗。
        reversible: true
        explore_status: covered
        dependencies: [shape_border_switch]
        assertions_hint: value=20。
        notes: evidence/explore_40_shape_apply.json。

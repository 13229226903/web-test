category_questions:
  Getting Started:
    - What is Pokecut?
    - What can I use Pokecut for?
    - Is Pokecut free?
    - Can I use Pokecut without signing up?
    - How do I start editing a photo?
  Account & Access:
    - How do I change the language in Pokecut?
    - Where can I see my remaining credits?
    - Where can I see my orders?
    - Can I use my web account to log in to the mobile app?
    - Where can I unsubscribe from Pokecut emails?
  Plans, Credits & Billing:
    - What are credits?
    - What is the difference between a Premium Plan and Credits Purchase?
    - Do purchased credits expire?
    - Can I cancel my Premium Plan?
    - Can I get a refund?
    - Why did my payment or renewal fail?
    - Can website credits be used in the Pokecut app?
  AI Tools & Editing:
    - Which AI tools does Pokecut provide?
    - What image formats can I upload?
    - How can I upload an image?
    - Why did my AI task fail?
    - What if I am not satisfied with the AI result?
  Batch, Download & Projects:
    - Can Pokecut edit images in batches?
    - Which batch tools are available?
    - Which marketplace sizes are supported in Batch Edit?
    - How do I download my edited image?
    - Why can’t I download in HD?
    - Where can I find my previous projects?
    - What should I do if download or project recovery fails?
  Commercial, Safety & Support:
    - Can I use Pokecut images commercially?
    - What content is not allowed?
    - How does Pokecut protect privacy?
    - How do I contact Pokecut support?
    - How long does support take to reply?

states:
  desktop_initial:
    description: PC 匿名首屏（默认 Popular 分类 11 条，第一条展开）
    trigger: 打开 /help 并等待 Hero H1 可见
    url_or_state_key: /help
    buttons:
      btn_popular_tag_credits:
        selector: 'button:has-text("Credits")'
        action_result: 填充搜索框为 Credits 并刷新搜索结果，留在 /help
        reversible: true
      btn_category_card:
        selector: 'button.help-v2-category-card'
        action_result: 页面滚动到 FAQ 区并切换分类，左侧导航高亮，默认展开第一条
        reversible: true
      btn_faq_nav_item:
        selector: 'button.help-v2-faq-section__nav-item'
        action_result: 切换右侧 FAQ 为对应分类，默认展开第一条
        reversible: true
  desktop_faq_accordion:
    description: FAQ 单条展开，同类只保留一条
    trigger: 点击 FAQ 问题行或 +/-
    buttons:
      btn_faq_question:
        selector: 'button.help-v2-faq-item__question'
        action_result: 展开答案并切 -；点击另一条则前一条收起；再点当前行收起
        reversible: true
  desktop_search_results:
    description: 搜索命中（如 credits = 13 results）
    trigger: 输入关键词回车或点击热门标签
    url_or_state_key: /help（页内刷新，不跳转）
    buttons:
      btn_search_result_item:
        selector: '[class*="search-panel__result"]'
        action_result: 结果列表含标题/摘要/所属分类，容器可竖向滚动
        reversible: true
    note: 结果数量文案为 'X results for “keyword”'；未显示 'Sorted by relevance' 文案（见 sync gap）
  desktop_search_empty:
    description: 搜索无结果空态
    trigger: 输入无匹配关键词（如 pokecut-unmatched-000）
    url_or_state_key: /help
    buttons:
      btn_submit_ticket:
        selector: 'button:has-text("Submit a ticket")'
        action_result: 进入工单承接（弹窗）
        reversible: true
  contact_ticket_dialog:
    description: 提交工单弹窗
    trigger: 点击底部 Contact us 或空态 Submit a ticket
    buttons:
      btn_submit:
        selector: 'div.purchase-order-dialog button:has-text("Submit")'
        action_result: 提交工单（探索只记录承接，不真实提交）
        reversible: false
  mobile_initial:
    description: 移动端 375x812 首屏
    trigger: 打开 /help 移动端 viewport
    url_or_state_key: /help
    buttons:
      btn_mobile_category_card:
        selector: 'button.help-v2-category-card'
        action_result: 进入分类 FAQ，顶部显示可横向滑动的分类标签
        reversible: true
  mobile_faq_category:
    description: 移动端分类 FAQ（顶部横向标签，当前高亮，单列列表）
    trigger: 点击任一分类卡片/标签
    buttons:
      btn_mobile_faq_tab:
        selector: 'button.help-v2-mobile-faq-section__tab'
        action_result: 切换分类，当前标签高亮
        reversible: true
      btn_mobile_faq_question:
        selector: 'button.help-v2-mobile-faq-item__question'
        action_result: 展开/收起答案
        reversible: true
  mobile_search_results:
    description: 移动端搜索结果（可竖向滚动查看全部）
    trigger: 输入 credits 回车
    buttons:
      btn_mobile_search_result:
        selector: 'button.help-v2-mobile-search-panel__result'
        action_result: 结果容器 scrollHeight>clientHeight，可滚动
        reversible: true

selector_semantic_gaps:
  - 搜索结果列表未渲染 'Sorted by relevance' 文案，需求有此项而页面缺失
  - 分类卡片文章数量以 'N articles' 文本渲染，与 FAQ 导航数量一致，是否硬编码需接口/配置证据
  - 工单弹窗类名为 purchase-order-dialog，字段为 Email/Subject/Description/Attachments，无独立 data-testid

prd_only_or_unverified_states:
  - 'Sorted by relevance' 排序标识未在页面上出现（gap）
  - 卡片文章数量的数据来源（配置/接口）未做接口级取证，仅验证展示值与导航一致
  - 点击底部 Contact us 后弹窗可打开，但未真实提交工单（红线：不执行不可逆提交）

notes:
  - 顶部导航 Contact us 通过深链 /help?category=commercial-safety-support&question=commercial-safety-support-4#contact-us 实现自动定位与展开
  - 首页与 /help 顶部导航均有 Contact us；/create 在菜单内也有 Contact us 入口
  - 移动端分类标签容器 div.help-v2-mobile-faq-section__tabs 可横向滚动（scrollW 976 > clientW 354）
  - 移动端分类卡片保持 2 列网格（每列约 171.5px）

  hero_desc:
    selector: 'p:has-text("Search guides for account")'
    text: Search guides for account, credits, subscriptions, AI tools, downloads, refunds, and commercial use.
  search_input:
    selector: 'input[placeholder*="Search by keyword"]'
    placeholder: Search by keyword, for example: credits, refund, download
  search_button:
    selector: 'button:has-text("Search")'
  popular_tags:
    selector: 'button:has-text("Credits") / button:has-text("Subscription") / button:has-text("Download") / button:has-text("Batch") / button:has-text("Project")'

category_cards:
  - title: Getting Started
    subtitle: Learn what Pokecut is, what you can use it for, free usage, sign-up, and how to start editing.
    articles: 5
  - title: Account & Access
    subtitle: Language switch, credits balance, orders, web/app account relation, and email unsubscribe.
    articles: 5
  - title: Plans, Credits & Billing
    subtitle: Credits, Premium Plan, one-time credits purchase, cancellation, refunds, orders, and payment issues.
    articles: 7
  - title: AI Tools & Editing
    subtitle: AI tools, upload formats, image upload, Photo Enhancer, Background Changer, Chat to Edit, and failed AI tasks.
    articles: 5
  - title: Batch, Download & Projects
    subtitle: Batch editing, marketplace sizes, download results, HD export, project history, and recovery issues.
    articles: 7
  - title: Commercial, Safety & Support
    subtitle: Commercial use, content safety, privacy, payment terms, and support tickets.
    articles: 5


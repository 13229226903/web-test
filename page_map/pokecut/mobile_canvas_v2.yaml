# Pokecut 移动端画布 v2 页面地图
# 来源: task-41「移动端优化（安国）」 + 2026-09-08 Playwright 移动视口(390x844, iPhone UA) 实测
# 入口: 首页 Start Creating for Free -> 文件选择器 -> 上传图片 -> /create/edit?pid=*
page: PokecutMobileCanvasV2
url: /create/edit?pid=*
viewport:
  width: 390
  height: 844
  is_mobile: true
  has_touch: true
landmark:
  selector: "li.mobile-primary-panel__tab:has-text('Trending Tools')"
  description: 移动端画布底部一级功能栏默认选中项
entry:
  from: "/"
  trigger: "点击 Start Creating for Free 并选择图片"
  selector: "button:has-text('Start Creating for Free')"
  file_chooser: true
  landing: "/create/edit?pid=*"
elements:
  header_signup:
    selector: "button:has-text('Sign up')"
    text: "Sign up"
  upgrade:
    selector: "button.mobile-primary-panel__upgrade"
    text: "Upgrade"
  primary_tabs:
    selector: "li.mobile-primary-panel__tab"
    items: ["Trending Tools", "AI Image", "Background", "Adjust", "Insert"]
  layer_button:
    selector: "button[aria-label='Layer']"
  view_full_image:
    selector: "button[aria-label='View full image']"
  close_icon_button:
    selector: "button[aria-label='Close']"
  close_icon_image:
    selector: "img[src*='nav_btn_pop_close.svg']"
  background_resize_width:
    selector: "label:has-text('Width') input[type='number']"
  background_resize_height:
    selector: "label:has-text('Height') input[type='number']"
  background_resize_lock:
    selector: "label:has-text('Lock Aspect Ratio') input[type='checkbox']"
states:
  mobile_canvas_default:
    description: 上传图片后默认画布，底部先显示一级栏，再显示 Trending Tools 二级缩略图。
    trigger: 上传成功进入 /create/edit?pid=*
    url_or_state_key: "/create/edit?pid=*"
    buttons:
      upgrade:
        selector: "button.mobile-primary-panel__upgrade"
        role_or_text: "Upgrade"
        visible_condition: 非会员或未登录
        enabled_condition: true
        action_result: 打开注册/登录弹窗，未进入独立购买页
        reversible: true
        explore_status: covered
      tab_trending_tools:
        selector: "li.mobile-primary-panel__tab:has-text('Trending Tools')"
        role_or_text: "Trending Tools"
        action_result: 保持/切换到 Trending Tools 二级面板
        reversible: true
        explore_status: covered
      tab_ai_image:
        selector: "li.mobile-primary-panel__tab:has-text('AI Image')"
        role_or_text: "AI Image"
        action_result: 打开 AI Image / Chat to edit 面板
        reversible: true
        explore_status: covered
      tab_background:
        selector: "li.mobile-primary-panel__tab:has-text('Background')"
        role_or_text: "Background"
        action_result: 打开 Background 二级面板
        reversible: true
        explore_status: covered
      tab_adjust:
        selector: "li.mobile-primary-panel__tab:has-text('Adjust')"
        role_or_text: "Adjust"
        action_result: 打开 Adjust 二级面板
        reversible: true
        explore_status: covered
        notes: 实测仅显示 Crop，未见 Filter。
      tab_insert:
        selector: "li.mobile-primary-panel__tab:has-text('Insert')"
        role_or_text: "Insert"
        action_result: 打开 Insert 面板，当前展示 Trending Tools 相同工具列表
        reversible: true
        explore_status: covered
      layer:
        selector: "button[aria-label='Layer']"
        role_or_text: "Layer"
        action_result: 打开图层面板，背景层显示 Bg
        reversible: true
        explore_status: covered
  trending_tools_panel:
    description: Trending Tools 二级面板，展示 11 个工具缩略图。
    trigger: 默认进入画布或点击 Trending Tools
    buttons:
      photo_enhancer:

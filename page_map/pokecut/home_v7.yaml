# 版本说明: 本文件为 home_v6.yaml 的下一版（局部复探增量），历史版本保留不覆盖。
page: PokecutHomeV5
url: /
landmark:
  selector: h1:has-text('All-in-One AI Photo Editor & Generator')
  description: 首页英文首屏标题；中文态对应 AI 照片编辑与生图工具
entry:
  from: Direct
  trigger: 直接访问站点根路径；中文 locale 会先落在 /zh，可通过页脚语言切换到 /
  selector: body
  note: 匿名态应显示 Sign up / Log in；本次探索保持未登录
elements:
  nav_logo:
    selector: header a[href='/'], a[href='/']:has(img[alt*='pokecut' i])
    text: Pokecut logo
    description: 顶部 Logo，点击回首页
  nav_ai_free_tools:
    selector: button:has-text('AI Free Tools')
    text: AI Free Tools
    description: 工具下拉入口
  nav_portrait_editor:
    selector: button:has-text('Portrait Editor')
    text: Portrait Editor
    description: 人像编辑下拉入口
  nav_discover:
    selector: button:has-text('Discover')
    text: Discover
    description: 发现下拉入口
  nav_pricing:
    selector: a[href='/pricing'], a[href$='/pricing']
    text: Pricing
    description: 定价页入口，中文态显示倒计时促销
  auth_signup:
    selector: button:has-text('Sign up')
    text: Sign up
  auth_login:
    selector: button:has-text('Log in')
    text: Log in
  hero_title:
    selector: h1:has-text('All-in-One AI Photo Editor & Generator')
    text: All-in-One AI Photo Editor & Generator
  hero_desc:
    selector: p:has-text('Use Pokecut to create, edit, and enhance images in one place')
  hero_cta:
    selector: button:has-text('Start Creating for Free')
    text: Start Creating for Free
  hero_prompt_upload:
    selector: button[aria-label='Upload image']
    text: Upload image
    note: 点击触发系统文件选择器；选择有效图片后进入 /create/edit?pid=，图片加载到画布。
  hero_prompt_model:
    selector: button:has-text('Pokecut Pro')
    text: Pokecut Pro
  hero_prompt_settings:
    selector: button[aria-label='Prompt settings']
    text: Prompt settings
  hero_prompt_generate:
    selector: button[aria-label='Generate']
    text: Generate
    note: 输入文本后 Generate 从 disabled 变为 enabled；点击后进入 /agent?pid=，URL 携带 pid 参数。
  popular_tools_region:
    selector: region:has-text('Popular Pokecut AI tools')
  feature_clothes_changer:
    selector: button:has-text('AI Clothes Changer')
    text: AI Clothes Changer
    note: 点击触发文件选择器；上传有效图片后进入 /agent 或 /create/edit?pid=，并打开 Clothes Changer 相关面板。
  feature_text_enhance:
    selector: button:has-text('Enhance Text in Images')
    text: Enhance Text in Images
    note: 点击直接跳转 /tools/ai-image-text-enhancer。
  feature_portrait_editor:
    selector: button:has-text('AI Portrait Editor')
    text: AI Portrait Editor
    note: 点击触发文件选择器；上传有效图片后进入 /agent 或 /create/edit?pid=，并打开 Portrait Editor 相关面板。
  feature_more_tools:
    selector: button:has-text('More Pokecut AI Tools')
    text: More Pokecut AI Tools
  models_region:
    selector: region:has-text('Choose the Right AI Model for Any Image')
  model_buttons:
    selector: button:has-text('Nano Banana 2'), button:has-text('Seedream 5.0 Lite'), button:has-text('Nano Banana Pro'),
      button:has-text('Seedream 5.0 Pro'), button:has-text('Pokecut Pro'), button:has-text('ChatGPT Image 2.0'), button:has-text('Seedream
      4.0'), button:has-text('Pokecut Basic'), button:has-text('Nano Banana 2 Lite')
    expected_order:
    - Nano Banana 2
    - Seedream 5.0 Lite
    - Nano Banana Pro
    - Seedream 5.0 Pro
    - Pokecut Pro
    - ChatGPT Image 2.0
    - Seedream 4.0
    - Pokecut Basic
    - Nano Banana 2 Lite
  templates_region:
    selector: text=Start Faster with Pokecut's AI Templates
  templates_cta:
    selector: button:has-text('See More Creations')
    text: See More Creations
    note: 实际点击后跳转 /create。
    landing: /create
  templates_cards:
    selector: null
    note: a11y snapshot 中模板卡片为 unnamed button，缺少可访问名称；见 sync.md bug candidate
  test_panel:
    selector: region:has-text('Test Your Photo Before You Edit')
    links:
      Pretty Scale: /tools/pretty-scale
      Ethnicity Guesser: /tools/ethnicity-guesser-ai
      Eye Color Detector: /tools/eye-color-detector
      Body Shape Detector: /tools/body-shape-detector
    note: 四个链接分别跳转 /tools/pretty-scale、/tools/ethnicity-guesser-ai、/tools/eye-color-detector、/tools/body-shape-detector。
  portrait_section:
    selector: region:has-text('Upgrade Every Portrait Details with Pokecut')
    tabs:
    - Retouch Face
    - Change Hair
    - Retouch Body
    - Change Background
    note: 4 个 tab 仅切换首页展示，不跳转；每个 tab 下有 8 个模板卡片，点击模板按 href 跳转对应工具/功能页。
  batch_section:
    selector: region:has-text('Edit up to 50 Photos in One Batch')
    actions:
    - Remove BG
    - Resize
    - Enhance
    - Change BG
    note: 4 个按钮均触发文件选择器；上传有效图片后进入 /batch-edit/edit?pid=。
  enhance_section:
    selector: region:has-text('Enhance Photo Quality for Every Detail')
    actions:
    - HD Enhance
    - Text Enhance
    - Portrait Enhance
    - Ultra Enhance
    note: HD Enhance / Text Enhance 直接跳转对应工具页；Portrait Enhance / Ultra Enhance 触发文件选择器，上传后进入 /agent 或 /create/edit?pid=。
  trust_section:
    selector: text=Pokecut is Trusted by Creators for Every Photo Creation
    stats:
    - 3M+ creators
    - 200+ AI tools
    - 500M+ edits processed
    - '#2 Product Hunt'
  reviews_section:
    selector: region:has-text('What Users Say About Pokecut?')
    users:
      Jessica Miller: https://www.producthunt.com/@jessica_miller_7
      Angelina Peng: https://www.producthunt.com/@angelina__s
      Leo Y.: https://www.producthunt.com/@leo_ye
      Zepeng She: https://www.producthunt.com/@rocsheh
      Rachit Magon: https://www.producthunt.com/@rachitmagon
  faq_section:
    selector: text=Frequently Asked Questions
    expected_question_count: 8
    links:
      pricing: /pricing
      term_of_use: /term-of-use
      refund_ticket: '[data-submit-ticket=''refund'']'
  mobile_app:
    selector: text=Pokecut Mobile App
  footer:
    selector: footer, text=Copyright © 2026 Pokecut All Rights Reserved.
  footer_language:
    selector: 'button:has-text(''Language: English''), button:has-text(''语言： English'')'
  debug_feedback:
    selector: button:has-text('DEBUG')
    expected_visible: true
tabs:
  portrait_detail:
    Retouch Face: button:has-text('Retouch Face')
    Change Hair: button:has-text('Change Hair')
    Retouch Body: button:has-text('Retouch Body')
    Change Background: button:has-text('Change Background')
modals: {}

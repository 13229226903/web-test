selector_semantic_gaps:
  - scale 选项无 data-scale / aria-selected
  - 主按钮为 div 无 role=button/aria-disabled，禁用态靠 cursor-not-allowed 推断
  - 结果态 Download/Edit More 无稳定 data-action

prd_only_or_unverified_states:
  - tooltip 美术视频资源名（enhanceremoveglace / enhanceremovemoire / enhancedocumentscanner）未做资源级断言
  - 多效果后端执行顺序（文本扫描->去反光->去摩尔纹->文字增强）需 request payload/后端日志
  - 免费 4 次按 IP 刷新与剩余次数抵扣顺序需可重置配额/后端计数器
  - 真 8K highest clarity 与二次增强 workflow 需前端判定口径/后端 trace
  - B 方案 text 专属购买拦截需 B 分桶账号/埋点事件

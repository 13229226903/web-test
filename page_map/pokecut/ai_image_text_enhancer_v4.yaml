    selector: 'h1:has-text("Enhance Text in Image to 8K Online Free")'
  desktop_upload_input:
    selector: '#singleUploadInput'
    input_type: file
    multiple: false
  mobile_upload_input:
    selector: '#file-upload'
    input_type: file
    multiple: false
  effects_title:
    selector: 'text=Choose the Effect'
  effects_multiselect_hint:
    selector: 'text=*Supports multiple selections'
  scales_title:
    selector: 'text=Upscale to'
  total_cost:
    selector: '[data-text-enhance-total-cost]'
    cost_state_attribute: data-text-enhance-cost-state
    observed_states:
      free: 免费额度可用，按钮显示 Free
      paid: 免费额度用尽/预部署，按钮显示数字点数
    observed_2026_10_12_test_server:
      # 2026-10-12 稳定回归复探（测试服 http://10.17.1.66:3001，匿名/免费态，素材 test_images/文字测例.jpg）
      # 断言基线已变，需业务/PRD 确认后由 test-writing 才可改 expected
      rule_verdict: confirmed_expected_change_2026-10-12（用户确认属预期变更，非缺陷）
      paid_rule:
        base_enhance_text: {2k: 5, 4k: 5, 8k: 10}
        per_extra_effect: 5   # Remove Glare / Remove Moire / Document Scanner 每个 +5
        examples: {all4@8k: 25, all4_minus_glare@8k: 20, enh_plus_scanner@4k: 10, mobile_default: 5, mobile_plus_glare: 10}
        non_enhance_only: 5   # 只选非增强效果（未选 Enhance Text）时一律 5，与分辨率档无关
        image_dependency: {1K.jpg_default: 5, 4K.jpg_default: 5, 4K.png_default: 10, 4K.png@4k: 10, 8K.jpg_default: 10, 8K.jpg_plus_glare: 15}
        free_quota: 免费额度态下基础价在 2k/4k 显示 Free（附加效果仍计费）
      matrix:
        - {effects: [remove_glare], scale: default, observed: '5', baseline_2026_08_29: '2'}
        - {effects: [remove_moire], scale: default, observed: '5', baseline_2026_08_29: '2'}
        - {effects: [document_scanner], scale: default, observed: '5', baseline_2026_08_29: '4'}
        - {effects: [enhance_text], scale: 2k, observed: Free, baseline_2026_08_29: '2'}
        - {effects: [enhance_text], scale: 4k, observed: Free, baseline_2026_08_29: '2'}
        - {effects: [enhance_text], scale: 8k, observed: '10', baseline_2026_08_29: null}
        - {effects: [enhance_text, document_scanner], scale: 2k, observed: '5', baseline_2026_08_29: '6'}
        - {effects: [enhance_text, document_scanner], scale: 4k, observed: '5', baseline_2026_08_29: '6'}
        - {effects: [enhance_text, document_scanner], scale: 8k, observed: '15', baseline_2026_08_29: null}
        - {effects: [enhance_text, remove_glare], scale: 2k, observed: '5', baseline_2026_08_29: null}
        - {effects: [enhance_text, remove_glare], scale: 8k, observed: '15', baseline_2026_08_29: null}
        - {effects: [enhance_text, remove_glare, remove_moire, document_scanner], scale: 4k, observed: '15', baseline_2026_08_29: '14'}
      notes: 2026-10-12 用户确认该变更为预期；test-writing 已按此更新 expected（禁用旧基线 2/4/6/14）。

effect_controls:
  enhance_text:
    selector: '[data-effect="enhance_text"]'
    text: Enhance Text
    tooltip_selector: '[data-effect="enhance_text"] [data-effect-help-icon]'
    tooltip_text: Enhance blurry text and improve readability.
  remove_glare:
    selector: '[data-effect="remove_glare"]'
    text: Remove Glare
    tooltip_selector: '[data-effect="remove_glare"] [data-effect-help-icon]'
    tooltip_text: Remove glare from reflective surfaces.
  remove_moire:
    selector: '[data-effect="remove_moire"]'
    text: Remove Moire
    tooltip_selector: '[data-effect="remove_moire"] [data-effect-help-icon]'
    tooltip_text: Reduce moire patterns in screens or printed images.
  document_scanner:
    selector: '[data-effect="document_scanner"]'
    text: Document Scanner
    tooltip_selector: '[data-effect="document_scanner"] [data-effect-help-icon]'
    tooltip_text: Turn a photographed document into a clean scanned page.


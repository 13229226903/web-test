    trigger: set_input_files #singleUploadInput = 1K.jpg
    selected_effects: [enhance_text]
    cost_state: free
    cost_text: Free
    primary_text: Enhance Free
  after_upload_default_paid:
    description: 预部署上传 1K 后默认态（付费态）
    trigger: DEBUG 切预部署并登录后上传 1K.jpg
    selected_effects: [enhance_text]

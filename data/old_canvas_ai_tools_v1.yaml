      expected_modes: [Standard Mode, Low-Res Mode, Portrait Mode, Text Mode, Ultra HD Mode]
      default_mode: Ultra HD Mode
      presets: [Standard Mode, Low-Res Mode, Portrait Mode, Text Mode, Ultra HD Mode]
      category: null
